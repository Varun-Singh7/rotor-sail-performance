[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "rotor_sail_performance"
version = "0.1.0"
description = "Learning project: fuel-saving estimates for Flettner rotor sails, verified against synthetic operational data"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Varun Singh" }]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "matplotlib>=3.7",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rotor_sail_performance = ["data/*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
